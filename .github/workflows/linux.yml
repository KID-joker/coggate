name: Linux prototype
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prototype:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.1"
          components: rustfmt, clippy
      - name: Toolchain provenance
        run: |
          rustc -Vv
          cargo -V
          cc --version
          uname -a
          lscpu
      - name: Formatting and lint
        run: |
          mkdir -p artifacts
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --features coggate/dev-tools --locked -- -D warnings 2>&1 | tee artifacts/lint.log
      - name: Core, lifecycle, engine and Linux isolation tests
        run: cargo test --workspace --features coggate/dev-tools --locked 2>&1 | tee artifacts/tests.log
      - name: Build production artifacts
        run: |
          mkdir -p artifacts
          cargo build -p coggate --release --example host-baseline --example host-integrated --locked --message-format=json > artifacts/release-build.jsonl
          python3 scripts/worker_path.py < artifacts/release-build.jsonl > artifacts/worker-path.txt
      - name: Complete Rust-host size increment
        id: size
        continue-on-error: true
        run: |
          python3 scripts/measure_size.py --baseline target/release/examples/host-baseline --integrated target/release/examples/host-integrated --worker "$(cat artifacts/worker-path.txt)" --output artifacts/size.json
      - name: Build and measure the complete screened experiment
        id: screened_size
        continue-on-error: true
        run: |
          cargo build -p coggate --release --example host-baseline --example host-screened --features dev-tools --locked --message-format=json > artifacts/screened-release-build.jsonl
          python3 scripts/worker_path.py < artifacts/screened-release-build.jsonl > artifacts/screened-worker-path.txt
          python3 scripts/measure_size.py --baseline target/release/examples/host-baseline --integrated target/release/examples/host-screened --worker "$(cat artifacts/screened-worker-path.txt)" --mechanism screened-composition --output artifacts/screened-size.json
      - name: Record solver and build the fixture generator
        run: |
          sha256sum scripts/offline_solver.py scripts/composition_solver.py scripts/shortcut_solver.py > artifacts/solver.sha256
          cargo build -p coggate --example demo --features dev-tools --locked
      - name: Strict Linux reference and independent solver evaluation
        run: |
          target/debug/examples/demo --run 100 2>&1 | tee artifacts/reference.log
          python3 scripts/evaluate_solver.py --samples 1000 --worker "$(cat artifacts/worker-path.txt)" > artifacts/offline-solver.json
      - name: Composition reference and adaptive solver experiment
        run: |
          target/debug/examples/demo --composition-run 100 2>&1 | tee artifacts/composition-reference.log
          python3 scripts/evaluate_solver.py --composition --samples 1000 --worker "$(cat artifacts/worker-path.txt)" > artifacts/composition-solver.json
      - name: Boundary mutation regressions
        run: |
          python3 scripts/check_boundary_mutants.py --samples 1000 --worker "$(cat artifacts/worker-path.txt)" > artifacts/boundary-mutants.json
      - name: Screened challenge references and frozen attacks
        run: |
          target/debug/examples/demo --screened-run 100 2>&1 | tee artifacts/screened-reference.log
          python3 scripts/evaluate_solver.py --composition --solver scripts/shortcut_solver.py --samples 1000 --worker "$(cat artifacts/worker-path.txt)" > artifacts/shortcut-before.json
          python3 scripts/evaluate_solver.py --composition --solver-arg=--ignore-guards --samples 1000 --worker "$(cat artifacts/worker-path.txt)" > artifacts/guards-before.json
          python3 scripts/evaluate_solver.py --composition --solver-arg=--original-input-guards --samples 1000 --worker "$(cat artifacts/worker-path.txt)" > artifacts/original-guards-before.json
          python3 scripts/evaluate_solver.py --screened-composition --solver scripts/shortcut_solver.py --samples 1000 --worker "$(cat artifacts/worker-path.txt)" > artifacts/shortcut-after.json
          python3 scripts/evaluate_solver.py --screened-composition --solver-arg=--ignore-guards --samples 1000 --worker "$(cat artifacts/worker-path.txt)" > artifacts/guards-after.json
          python3 scripts/evaluate_solver.py --screened-composition --solver-arg=--original-input-guards --samples 1000 --worker "$(cat artifacts/worker-path.txt)" > artifacts/original-guards-after.json
          python3 scripts/evaluate_solver.py --screened-composition --samples 1000 --worker "$(cat artifacts/worker-path.txt)" > artifacts/screened-adaptive.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          for name in ("shortcut-after.json", "guards-after.json", "original-guards-after.json"):
              report = json.loads((Path("artifacts") / name).read_text())
              assert report["issuance_attempts"] == 1000, name
              assert report["sample_count"] + report["issuance_failures"] == 1000, name
              assert report["sample_count"] > 0, name
              assert report["statuses"] == {"wrong_answer": report["sample_count"]}, name
          # Full adaptive success is a control, and demonstrates the mechanism
          # still fails the product's anti-solver gate.
          report = json.loads(Path("artifacts/screened-adaptive.json").read_text())
          assert report["issuance_attempts"] == 1000
          assert report["sample_count"] + report["issuance_failures"] == 1000
          assert report["sample_count"] == report["passed"] > 0
          PY
      - name: Pin the v2 comparison source
        uses: actions/checkout@v4
        with:
          ref: 39adabef6d62e9d0272a586b55ea2273bf5b6b6d
          path: .before-v2
      - name: Independently witnessed input-distribution comparison
        run: |
          cargo build --manifest-path .before-v2/Cargo.toml --target-dir target/before-v2 -p coggate --example demo --features dev-tools --locked
          python3 scripts/check_distribution_mutant.py --samples 1000 --fixture-generator target/before-v2/debug/examples/demo --worker "$(cat artifacts/worker-path.txt)" > artifacts/distribution-before.json
          python3 scripts/check_distribution_mutant.py --samples 1000 --require-rejected --worker "$(cat artifacts/worker-path.txt)" > artifacts/distribution-after.json
      - name: Enforce complete size budget
        if: steps.size.outcome == 'failure' || steps.screened_size.outcome == 'failure'
        run: exit 1
      - name: Publish public experiment diagnostics
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: python3 scripts/ci_report.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prototype-evidence
          path: |
            artifacts/size.json
            artifacts/offline-solver.json
            artifacts/composition-solver.json
            artifacts/boundary-mutants.json
            artifacts/shortcut-before.json
            artifacts/guards-before.json
            artifacts/shortcut-after.json
            artifacts/guards-after.json
            artifacts/original-guards-before.json
            artifacts/original-guards-after.json
            artifacts/screened-adaptive.json
            artifacts/distribution-after.json
            artifacts/distribution-before.json
            artifacts/screened-size.json
            artifacts/screened-release-build.jsonl
            artifacts/solver.sha256
            artifacts/release-build.jsonl
            artifacts/provenance.json
            artifacts/*.log
  order_synthesis:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.1"
      - name: Freeze solver identities and check the public parser
        run: |
          mkdir -p artifacts
          sha256sum scripts/order_solver.py scripts/composition_solver.py > artifacts/order-solver.sha256
          python3 scripts/order_solver.py --self-test
      - name: Build strict release worker and development fixture generator
        run: |
          cargo build -p coggate --release --example host-integrated --locked --message-format=json > artifacts/order-release-build.jsonl
          python3 scripts/worker_path.py < artifacts/order-release-build.jsonl > artifacts/order-worker-path.txt
          cargo build -p coggate --example demo --features dev-tools --locked
      - name: Strict Linux order-synthesis reference control
        run: |
          COGGATE_WORKER="$(cat artifacts/order-worker-path.txt)" target/debug/examples/demo --order-run 100 2>&1 | tee artifacts/order-reference.log
      - name: Adapted solver and controls on one fresh private batch
        run: |
          python3 scripts/evaluate_solver.py --order-synthesis --samples 1000 --worker "$(cat artifacts/order-worker-path.txt)" --retain-private-dir artifacts/order-PRIVATE > artifacts/order-adapted.json
          python3 scripts/evaluate_solver.py --order-synthesis --solver scripts/composition_solver.py --samples 1000 --worker "$(cat artifacts/order-worker-path.txt)" --fixtures artifacts/order-PRIVATE/private-fixtures.jsonl > artifacts/order-legacy-parser.json
          python3 scripts/evaluate_solver.py --order-synthesis --solver-arg=--examples-only --samples 1000 --worker "$(cat artifacts/order-worker-path.txt)" --fixtures artifacts/order-PRIVATE/private-fixtures.jsonl > artifacts/order-examples-only.json
          sha256sum --check artifacts/order-solver.sha256
      - name: Check judging outcomes and shared issuance denominators
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          names = ("order-adapted.json", "order-legacy-parser.json", "order-examples-only.json")
          reports = [json.loads((Path("artifacts") / name).read_text()) for name in names]
          adapted, legacy, lookup = reports
          issued = adapted["sample_count"]
          assert issued > 0
          assert adapted["fixture_provenance"] == "fresh_key_generated_after_solver_snapshot"
          for name, report in zip(names, reports):
              assert report["experiment"] == "public_examples_order_synthesis", name
              assert report["issuance_attempts"] == 1000, name
              assert report["sample_count"] == issued, name
              assert report["issuance_failures"] == adapted["issuance_failures"], name
              assert report["sample_count"] + report["issuance_failures"] == 1000, name
              assert report["case_count"] == 32 * issued, name
              assert report["fixtures_sha256"] == adapted["fixtures_sha256"], name
              assert report["worker_sha256"] == adapted["worker_sha256"], name
              assert report["os_isolation"] == "strict_worker_self_test", name
          assert adapted["statuses"] == {"passed": issued}
          assert legacy["statuses"] == {"solver_failure": issued}
          assert lookup["statuses"] == {"wrong_answer": issued}
          assert adapted["passed"] == issued
          assert legacy["passed"] == lookup["passed"] == 0
          order_sha = hashlib.sha256(Path("scripts/order_solver.py").read_bytes()).hexdigest()
          legacy_sha = hashlib.sha256(Path("scripts/composition_solver.py").read_bytes()).hexdigest()
          assert adapted["solver_sha256"] == lookup["solver_sha256"] == order_sha
          assert legacy["solver_sha256"] == legacy_sha
          # A legacy parser's incompatibility is not evidence of resistance.
          # The adapted non-model solver is the decisive positive control.
          PY
      - name: Check diagnostic instrumentation separately from judging
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          fields = {
              "permutations_enumerated", "example_evaluations", "matching_orders",
              "card_count", "public_example_count", "parse_ms", "search_ms",
              "codegen_ms", "source_bytes", "model_calls",
          }
          for name in ("order-adapted.json", "order-examples-only.json"):
              report = json.loads((Path("artifacts") / name).read_text())
              metrics = report["solver_self_reported_metrics"]
              assert metrics["provenance"] == "untrusted_solver_stderr_diagnostics_not_used_for_verdict"
              assert metrics["schema"] == "coggate-order-solver-v1"
              assert metrics["valid_records"] == report["sample_count"]
              assert metrics["invalid_records"] == 0
              assert set(metrics["fields"]) == fields
              for values in metrics["fields"].values():
                  assert values["count"] == report["sample_count"]
                  assert 0 <= values["min"] <= values["max"] <= 1_000_000_000_000
              observed = report["solver_stdout_source_bytes"]
              assert observed["provenance"] == "trusted_evaluator_measurement_of_successful_solver_stdout"
              for key in ("count", "total", "min", "max"):
                  assert metrics["fields"]["source_bytes"][key] == observed[key]
          # These checks validate reporting only. Self-reported timing and
          # model_calls neither establish model use nor change any verdict.
          PY
      - name: Publish public order-synthesis diagnostics
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          EVIDENCE_ARTIFACT: order-synthesis-evidence
          EVIDENCE_TEST_SCOPE: order solver self-test, strict Linux references and three public-only solver controls
        run: python3 scripts/ci_report.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: order-synthesis-evidence
          # Explicit public allowlist. Never upload artifacts/order-PRIVATE.
          path: |
            artifacts/order-adapted.json
            artifacts/order-legacy-parser.json
            artifacts/order-examples-only.json
            artifacts/provenance.json
            artifacts/order-release-build.jsonl
            artifacts/order-solver.sha256
            artifacts/order-reference.log
