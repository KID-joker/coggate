name: Linux prototype
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prototype:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.1"
          components: rustfmt, clippy
      - name: Toolchain provenance
        run: |
          rustc -Vv
          cargo -V
          cc --version
          uname -a
          lscpu
      - name: Formatting and lint
        run: |
          mkdir -p artifacts
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --features coggate/dev-tools --locked -- -D warnings 2>&1 | tee artifacts/lint.log
      - name: Core, lifecycle, engine and Linux isolation tests
        run: cargo test --workspace --features coggate/dev-tools --locked 2>&1 | tee artifacts/tests.log
      - name: Build production artifacts
        run: |
          mkdir -p artifacts
          cargo build -p coggate --release --example host-baseline --example host-integrated --locked --message-format=json > artifacts/release-build.jsonl
          python3 scripts/worker_path.py < artifacts/release-build.jsonl > artifacts/worker-path.txt
      - name: Complete Rust-host size increment
        id: size
        continue-on-error: true
        run: |
          python3 scripts/measure_size.py --baseline target/release/examples/host-baseline --integrated target/release/examples/host-integrated --worker "$(cat artifacts/worker-path.txt)" --output artifacts/size.json
      - name: Record solver and build the fixture generator
        run: |
          sha256sum scripts/offline_solver.py scripts/composition_solver.py scripts/shortcut_solver.py > artifacts/solver.sha256
          cargo build -p coggate --example demo --features dev-tools --locked
      - name: Strict Linux reference and independent solver evaluation
        run: |
          target/debug/examples/demo --run 100 2>&1 | tee artifacts/reference.log
          python3 scripts/evaluate_solver.py --samples 1000 --worker "$(cat artifacts/worker-path.txt)" > artifacts/offline-solver.json
      - name: Composition reference and adaptive solver experiment
        run: |
          target/debug/examples/demo --composition-run 100 2>&1 | tee artifacts/composition-reference.log
          python3 scripts/evaluate_solver.py --composition --samples 1000 --worker "$(cat artifacts/worker-path.txt)" > artifacts/composition-solver.json
      - name: Boundary mutation regressions
        run: |
          python3 scripts/check_boundary_mutants.py --samples 1000 --worker "$(cat artifacts/worker-path.txt)" > artifacts/boundary-mutants.json
      - name: Screened challenge references and frozen attacks
        run: |
          target/debug/examples/demo --screened-run 100 2>&1 | tee artifacts/screened-reference.log
          python3 scripts/evaluate_solver.py --composition --solver scripts/shortcut_solver.py --samples 1000 --worker "$(cat artifacts/worker-path.txt)" > artifacts/shortcut-before.json
          python3 scripts/evaluate_solver.py --composition --solver-arg=--ignore-guards --samples 1000 --worker "$(cat artifacts/worker-path.txt)" > artifacts/guards-before.json
          python3 scripts/evaluate_solver.py --screened-composition --solver scripts/shortcut_solver.py --samples 1000 --worker "$(cat artifacts/worker-path.txt)" > artifacts/shortcut-after.json
          python3 scripts/evaluate_solver.py --screened-composition --solver-arg=--ignore-guards --samples 1000 --worker "$(cat artifacts/worker-path.txt)" > artifacts/guards-after.json
          python3 scripts/evaluate_solver.py --screened-composition --samples 1000 --worker "$(cat artifacts/worker-path.txt)" > artifacts/screened-adaptive.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          for name in ("shortcut-after.json", "guards-after.json"):
              report = json.loads((Path("artifacts") / name).read_text())
              assert report["sample_count"] == 1000, name
              assert report["statuses"] == {"wrong_answer": 1000}, name
          # Full adaptive success is a control, and demonstrates the mechanism
          # still fails the product's anti-solver gate.
          report = json.loads(Path("artifacts/screened-adaptive.json").read_text())
          assert report["sample_count"] == report["passed"] == 1000
          PY
      - name: Enforce complete size budget
        if: steps.size.outcome == 'failure'
        run: exit 1
      - name: Publish public experiment diagnostics
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: python3 scripts/ci_report.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prototype-evidence
          path: |
            artifacts/size.json
            artifacts/offline-solver.json
            artifacts/composition-solver.json
            artifacts/boundary-mutants.json
            artifacts/shortcut-before.json
            artifacts/guards-before.json
            artifacts/shortcut-after.json
            artifacts/guards-after.json
            artifacts/screened-adaptive.json
            artifacts/solver.sha256
            artifacts/release-build.jsonl
            artifacts/provenance.json
            artifacts/*.log
