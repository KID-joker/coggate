[workspace]
members = ["packages/contracts", "packages/core"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"

[workspace.dependencies]
base64 = "0.22"
getrandom = "0.3"
hex = "0.4"
hmac = "0.12"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2.6"
thiserror = "2"
