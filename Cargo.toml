[workspace]
members = [
    "packages/benchmark",
    "packages/contracts",
    "packages/core",
    "packages/ffi",
    "packages/release",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
homepage = "https://github.com/KID-joker/coggate"
repository = "https://github.com/KID-joker/coggate"

[workspace.dependencies]
base64 = "0.22"
command-group = "5.0.1"
getrandom = "0.3"
hex = "0.4"
hmac = "0.12"
regex = "1"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2.6"
tempfile = "3"
thiserror = "2"
zeroize = "1"
