[workspace]
resolver = "2"
members = ["crates/coggate-core", "crates/coggate-worker", "crates/coggate"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.85"
repository = "https://github.com/KID-joker/coggate"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.dev]
debug = 1
