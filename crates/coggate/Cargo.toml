license.workspace = true
rust-version.workspace = true

[features]
dev-tools = ["coggate-core/dev-tools", "coggate-worker/engine-tests"]

[dependencies]
coggate-core = { path = "../coggate-core" }
coggate-worker = { path = "../coggate-worker" }
